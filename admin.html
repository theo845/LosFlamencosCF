<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Flamencos Admin</title>

    <style>
        label{
    display:block;
    margin-top:10px;
    margin-bottom:5px;
    font-size:13px;
    color:#ff4fa3;
    font-weight:bold;
}
        body {
            font-family: Arial;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: #222;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #ff4fa3;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #ff2f92;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>FLAMENCOS ADMIN</h2>

        <!-- LOGIN -->
        <div id="loginBox">
            <input id="email" placeholder="Email">
            <input id="password" type="password" placeholder="Password">
            <button onclick="login()">Login</button>
        </div>

        <!-- PANEL -->
        <div id="panel" style="display:none;">

            <label>Matches</label>
            <input id="matches" placeholder="Matches">

            <label>Wins</label>
            <input id="wins" placeholder="Wins">

            <label>Goals</label>
            <input id="goals" placeholder="Goals">

            <label>Players</label>
            <textarea id="players" placeholder="Nikos, Kostas, Giannis"></textarea>

            <label>Matches List</label>
            <textarea id="matchesList" placeholder="One match per line"></textarea>

            <button onclick="saveData()">Save Changes</button>

        </div>

    </div>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
            getFirestore, doc, getDoc, setDoc
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        import {
            getAuth, signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdYuyF4i0KBamoOooKkTQDgrmSB0m4bag",
            authDomain: "flamencosfc-98c0a.firebaseapp.com",
            projectId: "flamencosfc-98c0a",
            storageBucket: "flamencosfc-98c0a.firebasestorage.app",
            messagingSenderId: "754578604733",
            appId: "1:754578604733:web:6251d04ad81942e51e2dd4",
            measurementId: "G-B1VQ4DSX40"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // LOGIN
        window.login = async function () {

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            await signInWithEmailAndPassword(auth, email, password);

            document.getElementById("loginBox").style.display = "none";
            document.getElementById("panel").style.display = "block";

            loadData();
        };

        // LOAD DATA
        async function loadData() {

            const ref = doc(db, "club", "main");
            const snap = await getDoc(ref);

            if (!snap.exists()) return;

            const data = snap.data();

            document.getElementById("matches").value = data.matches;
            document.getElementById("wins").value = data.wins;
            document.getElementById("goals").value = data.goals;

            document.getElementById("players").value = data.players.join(",");
            document.getElementById("matchesList").value = data.matchesList.join("\n");
        }

        // SAVE DATA
        window.saveData = async function () {

            const ref = doc(db, "club", "main");

            await setDoc(ref, {
                matches: Number(document.getElementById("matches").value),
                wins: Number(document.getElementById("wins").value),
                goals: Number(document.getElementById("goals").value),

                players: document.getElementById("players").value.split(","),
                matchesList: document.getElementById("matchesList").value.split("\n")
            });

            alert("Saved successfully!");
        };

    </script>

</body>

</html>
